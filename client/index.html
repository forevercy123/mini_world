<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开放世界 · 阶段 0 性能摸底</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; }
      #app { width: 100%; height: 100%; display: block; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0a0e14; color: #8ab4d8; z-index: 100;
        font: 14px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif;
        transition: opacity 0.4s;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading h1 { font-size: 18px; font-weight: 500; color: #cfe3f5; }
      #loading .bar { width: 240px; height: 3px; background: #1c2733; border-radius: 2px; overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 0%; background: #4a9eff; transition: width 0.2s; }
      #loading .hint { font-size: 12px; color: #4d5f70; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">
      <h1>阶段 0 · 性能摸底</h1>
      <div class="bar"><i id="loadbar"></i></div>
      <div class="hint" id="loadhint">正在初始化渲染器…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
